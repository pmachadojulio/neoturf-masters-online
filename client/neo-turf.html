<script type="module">
import * as THREE from 'three';
/* NEO TURF MASTERS 2.5D web — Three.js low-poly + billboard pixel-art.
   Lógica (física, swing triple-tap, stats, hoyos) intacta del prototipo 2D.
   Mundo yardas (x=adelante, y=lateral, h=altura) → 3D: (y, h*HS, -x). */

// ---------- 1. DATOS ----------
const GOLFERS = [
  {name:'GEORGE SPINNER', nick:'YOUNG HERO', ctry:'USA', drv:3, acc:3, skl:3, rec:3, put:3,
   shirt:'#7a8b3d', dark:'#5a6b2d', pants:'#3d3d3d', skin:'#f0c090', hair:'#5a3a1a', feat:'sidepart'},
  {name:'THOMAS STEWART', nick:'TECHNICIAN', ctry:'UK', drv:2, acc:4, skl:5, rec:4, put:3,
   shirt:'#3d6b8b', dark:'#2d4b63', pants:'#222', skin:'#f0c8a0', hair:'#d8b83d', feat:'glasses'},
  {name:'FRANK ADAMS', nick:'VETERAN', ctry:'AUS', drv:1, acc:2, skl:4, rec:5, put:2,
   shirt:'#6b5a3d', dark:'#4a3d2d', pants:'#2d2d2d', skin:'#d8a070', hair:'#4a2d1a', feat:'cap_stache'},
  {name:'ROBERT LANDORT', nick:'SHOT MAKER', ctry:'GER', drv:4, acc:5, skl:2, rec:2, put:4,
   shirt:'#c8b83d', dark:'#8b7d2d', pants:'#1a1a1a', skin:'#f0c090', hair:'#b8b8b8', feat:'stern'},
  {name:'FERNANDO ALMEIDA', nick:'POWER GOLFER', ctry:'BRA', drv:5, acc:1, skl:1, rec:1, put:1,
   shirt:'#2d9b4d', dark:'#1d6b32', pants:'#1d4b22', skin:'#8b5a32', hair:'#1a1a1a', feat:'band'},
  {name:'TOYOSHIGE TAKENO', nick:'PUTT MASTER', ctry:'JPN', drv:3, acc:2, skl:4, rec:2, put:5,
   shirt:'#8b3d9b', dark:'#5d2d6b', pants:'#2d1d4b', skin:'#f0c090', hair:'#111', feat:'visor'},
];
const CLUBS = [
  {id:'1W', name:'1 WOOD', max:270, loft:12},
  {id:'3W', name:'3 WOOD', max:240, loft:16},
  {id:'5I', name:'5 IRON', max:200, loft:24},
  {id:'7I', name:'7 IRON', max:165, loft:32},
  {id:'9I', name:'9 IRON', max:135, loft:40},
  {id:'PW', name:'WEDGE',  max:100, loft:52},
  {id:'SW', name:'SAND WEDGE', max:75, loft:56},
  {id:'PT', name:'PUTTER', max:30,  loft:4},
];
const HOLES = [
  {par:4, tee:{x:0,y:0}, pin:{x:390,y:30}, fairwayW:46,
   green:{rx:20,ry:15,tilt:{x:0.55,y:-0.35}},
   bunkers:[{x:300,y:-18,rx:16,ry:9},{x:352,y:52,rx:14,ry:8}],
   water:[{x:200,y:70,rx:70,ry:26}],
   cliffs:[{x:250,y:-80,rx:95,ry:24}],
   trees:[{x:150,y:-55,t:'pine'},{x:250,y:60,t:'oak'},{x:330,y:-45,t:'pine'},{x:120,y:50,t:'palm'}]},
  {par:3, tee:{x:0,y:0}, pin:{x:175,y:-20}, fairwayW:40,
   green:{rx:16,ry:13,tilt:{x:-0.5,y:0.45}},
   bunkers:[{x:150,y:2,rx:18,ry:10},{x:190,y:-42,rx:12,ry:7}],
   water:[], trees:[{x:90,y:45,t:'oak'},{x:210,y:35,t:'pine'}],
   cliffs:[{x:120,y:-72,rx:85,ry:20}]},
  {par:5, tee:{x:0,y:0}, pin:{x:520,y:-40}, fairwayW:50,
   green:{rx:21,ry:15,tilt:{x:0.3,y:0.6}},
   bunkers:[{x:400,y:-70,rx:16,ry:9},{x:480,y:-8,rx:15,ry:8},{x:540,y:-60,rx:13,ry:7}],
   water:[{x:320,y:40,rx:60,ry:24}],
   cliffs:[{x:360,y:70,rx:80,ry:22},{x:560,y:-90,rx:60,ry:18}],
   trees:[{x:180,y:-60,t:'palm'},{x:300,y:-55,t:'pine'},{x:450,y:45,t:'oak'},{x:560,y:10,t:'pine'}]},
];
const HS = 0.35; // escala visual de altura
const V3 = (x,y,h)=>new THREE.Vector3(y,(h||0)*HS,-x);

// ---------- 2. PIXEL ART (sprites 1px + retratos + banderas) ----------
function headMap(g){
  const rows=[
  '...KKKK...',
  '..KHHHHK..',
  '.KHHHHHHK.',
  '.KHSSSSHK.',
  '.KHSESEHK.',
  '.KHSSSSHK.',
  '..KSSSSK..',
  '..KSssSK..',
  '...KSSK...',
  '....KK....'];
  const f=g.feat;
  if(f==='glasses'){rows[4]='.KGEEEEGK.';}
  if(f==='cap_stache'){rows[1]='..KCCCCK..';rows[2]='.KCCCCCCK.';rows[3]='.KCCCCCKKK';rows[6]='..KMMMMK..';}
  if(f==='band'){rows[0]='..KKKKKK..';rows[1]='.KHHHHHHK.';rows[2]='.KYYYYYYK.';}
  if(f==='visor'){rows[2]='.KVVVVVKKK';}
  return rows;
}
const TORSO_BENT=['.....KKKKK..','....KTTTTTK.','...KTTtTTTK.','...KTTtTTTK.','..KTTTTTtTK.','..KTtTTTtTK.','...KTTtTTK..','....KTTTK...','.....KTK....','......K.....'];
const TORSO_UP=['...KKKKK...','..KTTTTTK..','..KTTtTTK..','..KTTtTTK..','.KTTTtTTTK.','.KTtTTtTTK.','..KTTtTTK..','..KTTtTTK..','...KTTTK...','....KKK....'];
const LEGS_ADDR=['..KK....KK..','..KPK...KPK.','..KPK...KPK.','..KPpK..KPK.','..KPpK..KPK.','..KPK...KPK.','..KPK...KPK.','.KPPK...KPPK','.KKKK...KKKK','.............'];
const LEGS_FOLLOW=['...KK...KK..','...KPK..KPK.','...KPK..KPK.','...KPpK.KPK.','...KPpKKPK..','...KPK.KPK..','...KPK.KPK..','..KPPK..KPPK','..KKKK...KKK','.............'];
const FLAGS={
 USA:['RRRRRWWWWWWR','RRRRRWWWWWWR','BBBBBWWWWWWR','BBBBBRRRRRRR','BBBBBWWWWWWR','RRRRRRRRRRRR','WWWWWWWWWWWW','RRRRRRRRRRRR','WWWWWWWWWWWW'],
 UK:['BBBBWWBBBBB','BBBWRRWBBBB','BBWRRRRWBBB','WWRRRRRRRWW','BBWRRRRWBBB','BBBWRRWBBBB','BBBBWWBBBBB','BBBBWWBBBBB','BBBBWWBBBBB'],
 AUS:['BBBKBBBBBBB','BBBBBKBBBBB','BBWBBBBBWBB','BBBBBBBBBBB','BBWBBBBBWBB','BBBBBKBBBBB','BBBKBBBBBBB','BBBBBBBBBBB','BBBBBBBBBBB'],
 GER:['KKKKKKKKKKKK','KKKKKKKKKKKK','KKKKKKKKKKKK','RRRRRRRRRRRR','RRRRRRRRRRRR','RRRRRRRRRRRR','YYYYYYYYYYYY','YYYYYYYYYYYY','YYYYYYYYYYYY'],
 BRA:['GGGGGGGGGGGG','GGGGGGYYGGGG','GGGGYYYYYYGG','GGGYYBBYYGGG','GGGGYYYYYYGG','GGGGGGYYGGGG','GGGGGGGGGGGG','GGGGGGGGGGGG','GGGGGGGGGGGG'],
 JPN:['WWWWWWWWWWWW','WWWWWWWWWWWW','WWWRRRRRWWW','WWRRRRRRRWW','WWRRRRRRRWW','WWRRRRRRRWW','WWWRRRRRWWW','WWWWWWWWWWWW','WWWWWWWWWWWW']};
const FCOL={R:'#d83a3a',W:'#f4f4f4',B:'#2a4ad8',K:'#111',Y:'#ffd23f',G:'#2d9b4d'};
function palFor(g){
  return {K:'#101010',T:g.shirt,t:g.dark,P:g.pants,p:'rgba(0,0,0,0.35)',S:g.skin,s:'#c89868',
    H:g.hair,C:g.hair,E:'#101010',G:'#222',M:'#2d1a0d',V:'#f4f4f4',Y:'#ffd23f',W:'#f4f4f4'};
}
const SPR={};
function mkCanvas(rows,pal){
  const c=document.createElement('canvas');
  let w=0;rows.forEach(r=>w=Math.max(w,r.length));
  c.width=w;c.height=rows.length;const x=c.getContext('2d');
  rows.forEach((row,r)=>{for(let col=0;col<row.length;col++){const ch=row[col];
    if(ch==='.'||ch===' ')continue;x.fillStyle=pal[ch]||'#f0f';x.fillRect(col,r,1,1);}});
  return c;
}
function buildSprites(){
  for(let i=0;i<GOLFERS.length;i++){
    const g=GOLFERS[i],pal=palFor(g);
    SPR[i]={head:mkCanvas(headMap(g),pal),bent:mkCanvas(TORSO_BENT,pal),up:mkCanvas(TORSO_UP,pal),
      legsA:mkCanvas(LEGS_ADDR,pal),legsF:mkCanvas(LEGS_FOLLOW,pal)};
  }
}

// ---------- 3. ESTADO ----------
const c3d=document.getElementById('c3d'), c2d=document.getElementById('c2d');
const ctx=c2d.getContext('2d');
const W=c2d.width,H=c2d.height;
const G={
  screen:'select', gi:0, holeIndex:0, stroke:0, total:0, holed:false,
  ball:{x:0,y:0,h:0}, prev:{x:0,y:0}, lastSafe:{x:0,y:0},
  aim:0, clubIndex:0, curve:0, wind:{ang:0.5,mph:6},
  meter:null, flight:null, roll:null, putt:null,
  swing:{stage:'idle',t:0,pending:null},
  banner:null, fade:0, time:0,
};
buildSprites();
const golfer=()=>GOLFERS[G.gi];
const hole=()=>HOLES[G.holeIndex];
const meterSpeed=lie=>(1.55-golfer().acc*0.17)*(lie==='fairway'||lie==='tee'?1:lie==='green'?0.85:lie==='fringe'?1.2:lie==='rough'?1.45:lie==='shore'?2.2:1.8);
const heightSweet=()=>0.09+golfer().skl*0.028;
const redZone=lie=>Math.max(0.01,(lie==='shore'?0.42:lie==='sand'?0.30:lie==='rough'?0.17:lie==='fringe'?0.08:0.055)-golfer().rec*0.028);
const driveScale=()=>0.86+golfer().drv*0.04;
const powerCap=()=>golfer().drv>=5?1.14:golfer().drv>=4?1.06:1.0;

// ---------- 4. TERRENO (lógica) ----------
const d2=(ax,ay,bx,by)=>Math.hypot(bx-ax,by-ay);
const inEllipse=(x,y,e)=>((x-e.x)/e.rx)**2+((y-e.y)/e.ry)**2<1;
function holeLen(){const h=hole();return d2(h.tee.x,h.tee.y,h.pin.x,h.pin.y);}
function fairwayCenterAt(wx){
  const h=hole();
  const t=Math.max(0,Math.min(1,(wx-h.tee.x)/((h.pin.x-h.tee.x)||1)));
  return {y:h.tee.y+(h.pin.y-h.tee.y)*t,t};
}
function onGreen(x,y){const h=hole();return ((x-h.pin.x)/h.green.rx)**2+((y-h.pin.y)/h.green.ry)**2<1;}
function lieAt(x,y){
  const h=hole();
  if(d2(x,y,h.tee.x,h.tee.y)<4)return 'tee';
  for(const c of (h.cliffs||[]))if(inEllipse(x,y,c))return 'cliff';
  for(const b of h.bunkers)if(inEllipse(x,y,b))return 'sand';
  for(const w of h.water)if(inEllipse(x,y,w))return 'water';
  for(const w of h.water)if(inEllipse(x,y,{x:w.x,y:w.y,rx:w.rx*1.35,ry:w.ry*1.35}))return 'shore';
  if(onGreen(x,y))return 'green';
  {const nd=((x-h.pin.x)/h.green.rx)**2+((y-h.pin.y)/h.green.ry)**2;
   if(nd<1.8)return 'fringe';}
  const c=fairwayCenterAt(x);
  if(Math.abs(y-c.y)<h.fairwayW/2&&x>h.tee.x-10&&x<h.pin.x+30)return 'fairway';
  return 'rough';
}
const slopeAt=(x,y)=>{if(!onGreen(x,y))return{x:0,y:0};const t=hole().green.tilt;return{x:t.x*0.9,y:t.y*0.9};};
function distToPin(x,y){const h=hole();return d2(x,y,h.pin.x,h.pin.y);}
function autoClub(){
  const d=distToPin(G.ball.x,G.ball.y);
  if(onGreen(G.ball.x,G.ball.y))return 7;
  for(const i of [0,1,2,3,4,5])if(d<=CLUBS[i].max*driveScale()*1.02)return i;
  return 0;
}

// ---------- 5. SWING ----------
function startSwing(){
  if(G.meter||G.flight||G.roll||G.putt||G.screen!=='play'||G.swing.stage!=='idle')return;
  const lie=lieAt(G.ball.x,G.ball.y);
  if(lie==='water'||lie==='cliff')return;
  G.meter={phase:'power',p:0,dir:1,power:0,lie};
  G.swing={stage:'back',t:0,pending:null};
  setMsg(lie==='green'?'PUTTING: fija en la guía':'POWER!');
}
function tapMeter(){
  if(G.swing.stage!=='idle'&&G.swing.stage!=='back'&&G.swing.stage!=='top')return;
  const m=G.meter;if(!m)return startSwing();
  if(m.phase==='power'){
    m.power=Math.min(m.p,powerCap());
    if(lieAt(G.ball.x,G.ball.y)==='green'){G.meter=null;G.swing={stage:'pdown',t:0,pending:{power:m.power}};return;}
    m.phase='height';m.p=0.5;m.dir=Math.random()<0.5?-1:1;
    G.swing={stage:'top',t:0,pending:null};
    setMsg('HEIGHT!');
  }else{
    G.meter=null;
    G.swing={stage:'down',t:0,pending:{power:m.power,hPos:m.p,lie:m.lie,clubIndex:G.clubIndex,aim:G.aim,curve:G.curve}};
  }
}
function swingClubA(){
  const s=G.swing;
  if(s.stage==='back'){const p=G.meter?Math.min(1,G.meter.p):0;return -15-165*p;}
  if(s.stage==='top')return -185+Math.sin(performance.now()/90)*4;
  if(s.stage==='down')return -185+195*Math.min(1,s.t/0.13);
  if(s.stage==='pdown'){const k=Math.min(1,s.t/0.15);return -15+30*k-50*Math.max(0,k-0.5);}
  if(s.stage==='follow')return 10+125*Math.min(1,s.t/0.5*1.4);
  return -14+Math.sin(performance.now()/600)*1.5;
}
function impact(){
  const s=G.swing;
  if(s.stage==='pdown')doPutt(s.pending.power);
  else if(s.pending)doShot(s.pending);
  G.swing={stage:'follow',t:0,pending:null};
}
function doShot(ps){
  const g=golfer(),club=CLUBS[ps.clubIndex],lie=ps.lie;
  const sw=heightSweet(),rz=redZone(lie);
  if(ps.hPos<rz||ps.hPos>1-rz){G.stroke++;setMsg('MISS! (+1)');updateHUD();snd('miss');return;}
  const off=Math.abs(ps.hPos-0.5),perfect=off<sw;
  const hFactor=1.16-(ps.hPos*0.45);
  const errLat=(off-sw>0?(off-sw):0)*46*(6-g.acc)*0.35*((lie==='fairway'||lie==='tee')?1:1.8);
  const errDir=(ps.hPos>0.5?1:-1);
  const effMax=club.max*driveScale();
  const liePow={tee:1,fairway:1,green:1,fringe:0.92,rough:0.8,sand:0.65,shore:0.45}[lie]||1;
  const R=Math.min(effMax*1.12,Math.max(4,effMax*ps.power*hFactor*liePow*(perfect?1.02:1-(off*0.25))));
  const th=club.loft*Math.PI/180,gv=30;
  const v0=Math.sqrt(Math.max(1,R*gv/Math.max(0.12,Math.sin(2*th))));
  G.prev={x:G.ball.x,y:G.ball.y};G.lastSafe={x:G.ball.x,y:G.ball.y};
  freezeCam();
  G.flight={x:G.ball.x,y:G.ball.y,h:0,
    vx:v0*Math.cos(th)*Math.cos(ps.aim),vy:v0*Math.cos(th)*Math.sin(ps.aim),
    vh:v0*Math.sin(th),t:0,curve:(ps.curve*9*(0.4+ps.power))+(perfect?0:errDir*errLat*0.12),
    wx:Math.cos(G.wind.ang)*G.wind.mph*0.9,wy:Math.sin(G.wind.ang)*G.wind.mph*0.9,
    trail:[],R,perfect};
  G.stroke++;
  if(perfect){G.banner={txt:'NICE SHOT!',t:1.4};snd('nice');}
  else{setMsg(club.name+' '+R.toFixed(0)+'y');snd('hit');}
  updateHUD();
}
function doPutt(power){
  const need=puttNeed();
  const errLat=(power-need)*40+(Math.random()-0.5)*(6-golfer().put)*1.1;
  const a=G.aim+errLat*0.004;
  let v=4+power*20;
  if(lieAt(G.ball.x,G.ball.y)==='fringe')v*=0.85;
  G.prev={x:G.ball.x,y:G.ball.y};
  G.putt={x:G.ball.x,y:G.ball.y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,t:0};
  G.stroke++;
  setMsg(power<=need*1.15&&power>=need*0.85?'Buen toque':'A leer la caída');
  snd('putt');updateHUD();
}
function puttNeed(){
  const d=distToPin(G.ball.x,G.ball.y),s=slopeAt(G.ball.x,G.ball.y);
  const along=Math.cos(G.aim)*s.x+Math.sin(G.aim)*s.y;
  const vNeed=Math.sqrt(Math.max(4,2*12*d*1.12)); // inversión de dist=v²/2fr
  return Math.max(0.05,Math.min(1,((vNeed-4)/20)-along*0.10));
}

// ---------- 6. FÍSICA ----------
function stepFlight(dt){
  const f=G.flight;f.t+=dt;
  for(let i=0;i<3;i++){
    const h=dt/3;
    f.vy+=f.curve*h*0.55;
    f.x+=(f.vx+f.wx)*h;f.y+=(f.vy+f.wy)*h;
    f.vh-=30*h;f.h+=f.vh*h;
    if(f.h<=0){f.h=0;land();return;}
  }
  f.trail.push({x:f.x,y:f.y,h:f.h});
  if(f.trail.length>70)f.trail.shift();
  G.ball.x=f.x;G.ball.y=f.y;G.ball.h=f.h;
}
function land(){
  const f=G.flight;G.flight=null;
  const x=f.x,y=f.y,lie=lieAt(x,y);
  if(lie==='water'){G.stroke++;G.ball={x:G.lastSafe.x,y:G.lastSafe.y,h:0};G.fade=1;setMsg('¡Al agua! +1');updateHUD();autoAimClub();return;}
  if(lie==='cliff'){G.stroke++;G.ball={x:G.lastSafe.x,y:G.lastSafe.y,h:0};G.fade=1;setMsg('¡Al barranco! +1');updateHUD();autoAimClub();return;}
  if(x<-60||x>hole().pin.x+160||Math.abs(y)>240){G.stroke++;G.ball={x:G.lastSafe.x,y:G.lastSafe.y,h:0};G.fade=1;setMsg('¡Fuera! +1');updateHUD();autoAimClub();return;}
  const keep=lie==='fairway'?0.2:lie==='green'?0.18:lie==='fringe'?0.15:lie==='tee'?0.1:lie==='rough'?0.03:0.0;
  const sp=Math.hypot(f.vx,f.vy)*0.5*keep,a=Math.atan2(f.vy,f.vx);
  G.roll={x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp};
  G.ball.h=0;
}
function stepRoll(dt){
  const r=G.roll,lie=lieAt(r.x,r.y);
  const fr=lie==='green'?10:lie==='fringe'?14:lie==='fairway'?22:lie==='rough'?40:lie==='sand'||lie==='shore'?55:20;
  const s=slopeAt(r.x,r.y);
  r.vx+=s.x*18*dt;r.vy+=s.y*18*dt;
  const sp=Math.hypot(r.vx,r.vy),dec=fr*dt;
  if(sp<=Math.max(0.6,dec)){G.roll=null;G.ball.x=r.x;G.ball.y=r.y;settle();return;}
  r.vx-=r.vx/sp*dec;r.vy-=r.vy/sp*dec;
  r.x+=r.vx*dt;r.y+=r.vy*dt;
  const l2=lieAt(r.x,r.y);

}
function stepPutt(dt){
  const p=G.putt,s=slopeAt(p.x,p.y);

  if(sp<=Math.max(0.4,fr)){G.putt=null;G.ball.x=p.x;G.ball.y=p.y;settle();return;}
  p.vx-=p.vx/sp*fr;p.vy-=p.vy/sp*fr;
  p.x+=p.vx*dt;p.y+=p.vy*dt;

  ballMesh.visible=!G.holed||G.flight||G.roll||G.putt||true;
  const sh=V3(G.ball.x,G.ball.y,0);
  shadowMesh.position.set(sh.x,0.03,sh.z);
  const hh=G.ball.h||0;
  shadowMesh.material.opacity=Math.max(0.08,0.35-hh*0.012);
  const ss=Math.max(0.4,1-hh*0.02);shadowMesh.scale.set(ss,ss,1);
  // estela
  if(G.flight&&G.flight.trail.length>1){
    const pts=G.flight.trail.filter((_,i)=>i%2===0).map(p=>V3(p.x,p.y,p.h||0));
    trailLine.geometry.setFromPoints(pts);
    trailLine.visible=true;
  }else trailLine.visible=false;
  // golfista billboard junto a la bola
  const d=aimDir3();
  golferSprite.position.set(bp.x-d.z*1.7,1.7,bp.z+d.x*1.7);
  golferSprite.visible=!G.flight&&!G.holed;
  const k=golfKey();
  if(k!==lastGolfKey||G.swing.stage!=='idle'){drawGolfSprite();lastGolfKey=k;}
  // aim
  const showAim=G.screen==='play'&&!G.meter&&!G.flight&&!G.roll&&!G.putt&&!G.holed;
  aimLine.visible=aimRing.visible=showAim;
  if(showAim){
    const club=CLUBS[G.clubIndex],maxR=club.max*driveScale();
    const rr=club.id==='PT'?Math.min(28,distToPin(G.ball.x,G.ball.y)):Math.min(maxR,distToPin(G.ball.x,G.ball.y));
    const ex=G.ball.x+Math.cos(G.aim)*rr,ey=G.ball.y+Math.sin(G.aim)*rr;
    const pts=[];
    for(let i=0;i<=14;i++){
      const t=i/14;
      const px=G.ball.x+(ex-G.ball.x)*t,py=G.ball.y+(ey-G.ball.y)*t+G.curve*Math.sin(t*Math.PI)*14;
      pts.push(V3(px,py,0.4));
    }
    aimLine.geometry.setFromPoints(pts);
    aimLine.computeLineDistances();
    const ep=V3(ex,ey,0.15);
    aimRing.position.copy(ep);
    const pu=1+Math.sin(performance.now()/200)*0.12;
    aimRing.scale.set(pu,pu,pu);
    aimRing.material.color.set(G.curve?0x40c4ff:0xffeb3b);
  }
  // agua + nubes + bandera + flechas
  for(const w of waterMats)w.map.offset.x+=dt*0.06;
  cloudGroup.children.forEach((c,i)=>{c.position.x+=dt*(1.2+i*0.2);if(c.position.x>240)c.position.x=-240;});
  if(flagPennant)flagPennant.rotation.y=Math.sin(G.time*3)*0.25;
  const s0=slopeAt(hole().pin.x,hole().pin.y);
  const an=Math.atan2(s0.y,s0.x);
  slopeArrows.forEach(sp=>{
    sp.visible=lieAt(G.ball.x,G.ball.y)==='green';
    sp.position.y=1.3+Math.sin(G.time*3+sp.userData.k)*0.25;
    sp.material.rotation=-an;
  });
  updateCamera(dt);
}
function worldToScreen(v){
  const p=v.clone().project(camera);
  return {x:(p.x*0.5+0.5)*W,y:(-p.y*0.5+0.5)*H,behind:p.z>1};
}

// ---------- 9. INPUT / AUDIO / HUD ----------
function beginPlay(){
  G.screen='intro';
  const h=hole();
  G.ball={x:h.tee.x,y:h.tee.y,h:0};G.prev={x:h.tee.x,y:h.tee.y};G.lastSafe={x:h.tee.x,y:h.tee.y};
  buildCourse();cutCamToBall();autoAimClub();
}
document.addEventListener('keydown',e=>{
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();
  if(e.repeat&&e.code!=='ArrowLeft'&&e.code!=='ArrowRight')return;
  const k=e.code;
  if(G.screen==='select'){
    if(k.indexOf('Digit')===0){const n=+k.slice(5);if(n>=1&&n<=6){G.gi=n-1;beginPlay();}}
    else if(k==='Space'||k==='Enter')beginPlay();
    return;
  }
  if(G.screen==='intro'){
    if(k==='Space'||k==='Enter'){G.screen='play';cutCamToBall();}
    return;
  }
  if(k==='ArrowLeft')G.aim-=0.028;
  else if(k==='ArrowRight')G.aim+=0.028;
  else if(k==='ArrowUp'){G.clubIndex=Math.max(0,G.clubIndex-1);updateHUD();}
  else if(k==='ArrowDown'){G.clubIndex=Math.min(6,G.clubIndex+1);updateHUD();}
  else if(k==='KeyZ'){G.curve=-1;setMsg('HOOK (B)');}
  else if(k==='KeyX'){G.curve=1;setMsg('SLICE (C)');}
  else if(k==='KeyC'){G.curve=0;setMsg('RECTO');}
  else if(k==='KeyR')autoAimClub();
  else if(k==='Space'){if(G.holed){nextHole();return;}tapMeter();}
});
c2d.addEventListener('click',()=>{
  if(G.screen==='select')beginPlay();
  else if(G.screen==='intro'){G.screen='play';cutCamToBall();}
  else if(G.holed)nextHole();
  else tapMeter();
});
c2d.addEventListener('mousemove',e=>{
  if(G.screen!=='play'||G.meter||G.flight)return;
  G.aim+=e.movementX*0.0035;
});
function setMsg(m){document.getElementById('hudMsg').textContent=m;}
function updateHUD(){
  const h=hole(),g=golfer(),club=CLUBS[G.clubIndex];
  const names=['1st','2nd','3rd'];
  document.getElementById('hudHole').textContent=(names[G.holeIndex]||(G.holeIndex+1)+'th')+' HOLE · PAR '+h.par;
  document.getElementById('hudGolfer').textContent=g.name;
  document.getElementById('hudWind').textContent=G.wind.mph.toFixed(0)+' mph';
  document.getElementById('windArrow').style.transform='rotate('+G.wind.ang+'rad)';
  document.getElementById('hudStroke').textContent=G.stroke;
  const d=distToPin(G.ball.x,G.ball.y);
  document.getElementById('hudClub').textContent=club.name+' '+(club.max*driveScale()).toFixed(0)+'y '+d.toFixed(0)+'y '+lieAt(G.ball.x,G.ball.y);
}
let AC=null;
function tone(f,dur,delay){
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const t=AC.currentTime+(delay||0);
    const o=AC.createOscillator(),gn=AC.createGain();
    o.connect(gn);gn.connect(AC.destination);
    o.type='square';o.frequency.value=f;gn.gain.value=0.05;
    o.start(t);o.stop(t+dur);
  }catch(e){}
}
function snd(kind){
  if(kind==='hit'){tone(220,0.08);tone(440,0.1,0.05);}
  else if(kind==='nice'){tone(660,0.1);tone(880,0.1,0.1);tone(1320,0.2,0.2);}
  else if(kind==='miss'){tone(140,0.25);}
  else if(kind==='putt'){tone(330,0.07);}
  else if(kind==='hole'){tone(523,0.12);tone(659,0.12,0.12);tone(784,0.12,0.24);tone(1046,0.3,0.36);}
}

// ---------- 10. GAME LOOP ----------
buildCourse();
cutCamToBall();
updateHUD();
let last=performance.now();
function loop(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;
  G.time+=dt;
  if(G.banner){G.banner.t-=dt;if(G.banner.t<=0)G.banner=null;}
  if(G.screen==='play'){
    const sw=G.swing;
    if(sw.stage==='back'&&!G.meter)sw.stage='idle';
    if(sw.stage==='top'&&(!G.meter||G.meter.phase!=='height'))sw.stage='idle';
    if(sw.stage==='down'||sw.stage==='pdown'){sw.t+=dt;if(sw.t>=0.15)impact();}
    else if(sw.stage==='follow'){sw.t+=dt;if(sw.t>0.55&&!G.flight)sw.stage='idle';}
    if(G.meter){
      const sp=meterSpeed(G.meter.lie)*(G.meter.phase==='power'?0.9:1.25);
      if(G.meter.phase==='power'){
        G.meter.p+=sp*dt*G.meter.dir;
        if(G.meter.p>=powerCap()){G.meter.p=powerCap();G.meter.dir=-1;}
        if(G.meter.p<=0){G.meter.p=0;G.meter.dir=1;}
      }else{
        G.meter.p+=sp*dt*1.4*G.meter.dir;
        if(G.meter.p>=1){G.meter.p=1;G.meter.dir=-1;}
        if(G.meter.p<=0){G.meter.p=0;G.meter.dir=1;}
      }
    }
    if(G.flight)stepFlight(dt);
    else if(G.roll)stepRoll(dt);
    else if(G.putt)stepPutt(dt);
  }
  syncScene(dt);
  renderer.render(scene,camera);
  drawOverlay();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
