<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>NEO TURF MASTERS — vista trasera fiel (prototipo)</title>
<style>
  *{box-sizing:border-box} body{margin:0;background:#06130b;color:#fff;font-family:"Courier New",monospace}
  #top{display:flex;gap:10px;align-items:center;justify-content:center;padding:8px;background:#0d2b16;border-bottom:3px solid #ffd23f;flex-wrap:wrap}
  .tag{background:#123c1f;border:2px solid #ffd23f;border-radius:6px;padding:2px 10px;font-weight:bold}
  #windArrow{display:inline-block}
  #wrap{display:flex;justify-content:center;padding:8px}
  canvas{background:#000;border:4px solid #0a1f10;border-radius:8px;max-width:97vw;height:auto}
  #help{text-align:center;font-size:13px;opacity:.9;padding:6px}
  kbd{background:#222;border:1px solid #888;border-radius:4px;padding:0 5px}
</style>
</head>
<body>
<div id="top">
  <span class="tag" id="hudHole">1st HOLE · PAR 4</span>
  <span class="tag">⛳ <span id="hudGolfer">YOUNG HERO</span></span>
  <span class="tag">WIND <span id="windArrow">➤</span> <span id="hudWind">5 mph</span></span>
  <span class="tag">STROKE <span id="hudStroke">0</span></span>
  <span class="tag" id="hudClub">1 WOOD · 270y</span>
  <span class="tag" id="hudMsg">···</span>
</div>
<div id="wrap"><canvas id="game" width="960" height="540"></canvas></div>
<div id="help">
  <kbd>1</kbd>-<kbd>6</kbd> golfista ·
  <kbd>←</kbd><kbd>→</kbd> apuntar · <kbd>↑</kbd><kbd>↓</kbd> palo ·
  <kbd>Z</kbd> hook / <kbd>X</kbd> slice ·
  <kbd>ESPACIO</kbd>: iniciar → potencia → altura ·
  <kbd>R</kbd> auto-apuntar
</div>
<script>
'use strict';
/* NEO TURF MASTERS (SNK/Nazca 1996) — núcleo fiel con VISTA TRASERA.
   El original se juega detrás del golfista: sprite animando el swing,
   campo en perspectiva hacia el horizonte, gauge vertical POWER/HEIGHT,
   interstitial "NICE SHOT!", putting con lectura de slope.
   Mundo en yardas (x=adelante, y=lateral). Proyección pseudo-3D arcade. */

// ---------- 1. DATOS ----------
const GOLFERS = [
  {id:'hero',  name:'YOUNG HERO',  ctry:'USA', drv:3, acc:3, skl:3, rec:3, put:3, shirt:'#e53935', pants:'#2b3a67', skin:'#f2c89b', cap:'#ffffff'},
  {id:'tech',  name:'TECHNICIAN',  ctry:'UK',  drv:2, acc:4, skl:5, rec:4, put:3, shirt:'#1e88e5', pants:'#263238', skin:'#e8b88a', cap:'#0d47a1'},
  {id:'vet',   name:'VETERAN',     ctry:'AUS', drv:1, acc:2, skl:4, rec:5, put:2, shirt:'#6d4c41', pants:'#3e2723', skin:'#d9a06f', cap:'#4e342e'},
  {id:'maker', name:'SHOT MAKER',  ctry:'GER', drv:4, acc:5, skl:2, rec:2, put:4, shirt:'#fdd835', pants:'#212121', skin:'#f2c89b', cap:'#212121'},
  {id:'power', name:'POWER GOLFER',ctry:'BRA', drv:5, acc:1, skl:1, rec:1, put:1, shirt:'#00e676', pants:'#1b5e20', skin:'#a06a42', cap:'#00c853'},
  {id:'putt',  name:'PUTT MASTER', ctry:'JPN', drv:3, acc:2, skl:4, rec:2, put:5, shirt:'#ab47bc', pants:'#4a148c', skin:'#f2c89b', cap:'#ffeb3b'},
];
const CLUBS = [
  {id:'1W', name:'1 WOOD', max:270, loft:12},
  {id:'3W', name:'3 WOOD', max:240, loft:16},
  {id:'5I', name:'5 IRON', max:200, loft:24},
  {id:'7I', name:'7 IRON', max:165, loft:32},
  {id:'9I', name:'9 IRON', max:135, loft:40},
  {id:'PW', name:'WEDGE',  max:100, loft:52},
  {id:'SW', name:'SAND WEDGE', max:75, loft:56},
  {id:'PT', name:'PUTTER', max:30,  loft:4},
];
const HOLES = [
  {par:4, tee:{x:0,y:0}, pin:{x:390,y:30}, fairwayW:46,
   green:{rx:20,ry:15,tilt:{x:0.55,y:-0.35}},
   bunkers:[{x:300,y:-18,rx:16,ry:9},{x:352,y:52,rx:14,ry:8}],
   water:[{x:200,y:70,rx:70,ry:26}], trees:[{x:150,y:-55},{x:250,y:60},{x:330,y:-45},{x:120,y:50}]},
  {par:3, tee:{x:0,y:0}, pin:{x:175,y:-20}, fairwayW:40,
   green:{rx:16,ry:13,tilt:{x:-0.5,y:0.45}},
   bunkers:[{x:150,y:2,rx:18,ry:10},{x:190,y:-42,rx:12,ry:7}],
   water:[], trees:[{x:90,y:45},{x:210,y:35}]},
  {par:5, tee:{x:0,y:0}, pin:{x:520,y:-40}, fairwayW:50,
   green:{rx:21,ry:15,tilt:{x:0.3,y:0.6}},
   bunkers:[{x:400,y:-70,rx:16,ry:9},{x:480,y:-8,rx:15,ry:8},{x:540,y:-60,rx:13,ry:7}],
   water:[{x:320,y:40,rx:60,ry:24}], trees:[{x:180,y:-60},{x:300,y:-55},{x:450,y:45},{x:560,y:10}]},
];

// ---------- 2. ESTADO ----------
const cv = document.getElementById('game'), ctx = cv.getContext('2d');
const W = cv.width, H = cv.height;
const HOR = 150;      // horizonte en px
const G = {
  screen:'select', gi:0, holeIndex:0, stroke:0, total:0, holed:false,
  ball:{x:0,y:0,h:0}, prev:{x:0,y:0}, lastSafe:{x:0,y:0},
  aim:0, clubIndex:0, curve:0,
  wind:{ang:0.5, mph:6},
  meter:null, flight:null, roll:null, putt:null,
  swing:{stage:'idle', t:0, pending:null},  // idle|back|top|down|follow|puttswing
  banner:null, fade:0,
  camX:-14, K:55,
  cloudT:0,
};
const golfer = ()=>GOLFERS[G.gi];
const hole = ()=>HOLES[G.holeIndex];
const meterSpeed = lie => (1.55 - golfer().acc*0.17) * (lie==='fairway'||lie==='tee'?1 : lie==='green'?0.85 : lie==='rough'?1.45 : 1.8);
const heightSweet = ()=> 0.09 + golfer().skl*0.028;
const redZone = lie => Math.max(0.01,(lie==='sand'?0.30 : lie==='rough'?0.17 : 0.055) - golfer().rec*0.028);
const driveScale = ()=> 0.86 + golfer().drv*0.05;
const powerCap = ()=> golfer().drv>=5?1.14 : golfer().drv>=4?1.06 : 1.0;

// ---------- 3. TERRENO ----------
const d2=(ax,ay,bx,by)=>Math.hypot(bx-ax,by-ay);
function inEllipse(x,y,e){return ((x-e.x)/e.rx)**2+((y-e.y)/e.ry)**2<1;}
function holeLen(){const h=hole();return d2(h.tee.x,h.tee.y,h.pin.x,h.pin.y);}
function fairwayCenterAt(wx){
  const h=hole(), L=holeLen()||1;
  const t=Math.max(0,Math.min(1,(wx-h.tee.x)/(h.pin.x-h.tee.x||1)));
  return {y:h.tee.y+(h.pin.y-h.tee.y)*t, t};
}
function onGreen(x,y){const h=hole();return ((x-h.pin.x)/h.green.rx)**2+((y-h.pin.y)/h.green.ry)**2<1;}
function lieAt(x,y){
  const h=hole();
  if(d2(x,y,h.tee.x,h.tee.y)<4) return 'tee';
  for(const b of h.bunkers) if(inEllipse(x,y,b)) return 'sand';
  for(const w of h.water) if(inEllipse(x,y,w)) return 'water';
  if(onGreen(x,y)) return 'green';
  const c=fairwayCenterAt(x);
  if(Math.abs(y-c.y)<h.fairwayW/2 && x>h.tee.x-10 && x<h.pin.x+30) return 'fairway';
  return 'rough';
}
function slopeAt(x,y){
  if(!onGreen(x,y)) return {x:0,y:0};
  const t=hole().green.tilt;
  return {x:t.x*0.9, y:t.y*0.9};
}
function distToPin(x,y){const h=hole();return d2(x,y,h.pin.x,h.pin.y);}
function autoClub(){
  const d=distToPin(G.ball.x,G.ball.y);
  if(onGreen(G.ball.x,G.ball.y)) return 7;
  const order=[0,1,2,3,4,5];
  for(const i of order){ if(d<=CLUBS[i].max*driveScale()*1.02) return i; }
  return 0;
}

// ---------- 4. SWING (triple tap + animación del golfista) ----------
function startSwing(){
  if(G.meter||G.flight||G.roll||G.putt||G.screen!=='play'||G.swing.stage!=='idle') return;
  const lie=lieAt(G.ball.x,G.ball.y);
  if(lie==='water') return;
  G.meter={phase:'power',p:0,dir:1,power:0,lie};
  G.swing={stage:'back',t:0,pending:null};
  setMsg(lie==='green'?'PUTTING: fija la potencia en la guía':'POWER: ¡fija con ESPACIO!');
}
function tapMeter(){
  if(G.swing.stage!=='idle'&&G.swing.stage!=='back'&&G.swing.stage!=='top') return;
  const m=G.meter; if(!m) return startSwing();
  if(m.phase==='power'){
    m.power=Math.min(m.p,powerCap());
    if(lieAt(G.ball.x,G.ball.y)==='green'){
      G.meter=null;
      G.swing={stage:'pdown',t:0,pending:{power:m.power}};
      return;
    }
    m.phase='height'; m.p=0.5; m.dir=Math.random()<0.5?-1:1;
    G.swing={stage:'top',t:0,pending:null};
    setMsg('HEIGHT: ¡clava el centro blanco!');
  } else {
    const pend={power:m.power,hPos:m.p,lie:m.lie,clubIndex:G.clubIndex,aim:G.aim,curve:G.curve};
    G.meter=null;
    G.swing={stage:'down',t:0,pending:pend};
  }
}
// pose del swing: clubA en grados (0=abajo hacia la bola, -=atrás, +=adelante)
function swingPose(){
  const s=G.swing;
  if(s.stage==='back'){
    const p=G.meter?Math.min(1,G.meter.p):0;
    return {lean:0.15+0.12*p, clubA:-20-170*p, crouch:0.5+0.12*p};
  }
  if(s.stage==='top') return {lean:0.28, clubA:-195+Math.sin(performance.now()/90)*4, crouch:0.62};
  if(s.stage==='down'){const k=Math.min(1,s.t/0.13);return {lean:0.28-0.2*k, clubA:-195+205*k, crouch:0.62-0.17*k};}
  if(s.stage==='pdown'){const k=Math.min(1,s.t/0.15);return {lean:0.12, clubA:-20+38*k-46*Math.max(0,k-0.5)*2, crouch:0.5};}
  if(s.stage==='follow'){const k=Math.min(1,s.t/0.5);return {lean:-0.12, clubA:10+120*Math.min(1,k*1.4), crouch:0.4-0.08*k};}
  return {lean:0.12+Math.sin(performance.now()/600)*0.02, clubA:-16, crouch:0.5}; // idle respirando
}
/* Matemática del tiro:
   R = effMax · power · hFactor ;  v0 = sqrt(R·g/sin(2·loft))
   x += (vx + Wx)·dt … y += (vy + Wy)·dt + curva·t (Magnus hook/slice)
   h: parábola con g. Viento mph→yd/s (k≈1.1): 10 mph ≈ 12y al driver. */
function impact(){
  const s=G.swing;
  if(s.stage==='pdown'){ doPutt(s.pending.power); }
  else if(s.pending){ doShot(s.pending); }
  G.swing={stage:'follow',t:0,pending:null};
}
function doShot(ps){
  const g=golfer(), club=CLUBS[ps.clubIndex], lie=ps.lie;
  const sw=heightSweet(), rz=redZone(lie);
  if(ps.hPos<rz||ps.hPos>1-rz){
    G.stroke++; setMsg('¡MISS! El palo abanica el aire (+1)'); updateHUD(); snd('miss');
    return;
  }
  const off=Math.abs(ps.hPos-0.5), perfect=off<sw;
  const hFactor=1.12-(ps.hPos*0.45);
  const errLat=(off-sw>0?(off-sw):0)*46*(6-g.acc)*0.35*(lie==='fairway'||lie==='tee'?1:1.8);
  const errDir=(ps.hPos>0.5?1:-1);
  const effMax=club.max*driveScale();
  const R=Math.max(4,effMax*ps.power*hFactor*(perfect?1.02:1-(off*0.25)));
  const th=club.loft*Math.PI/180, gv=30;
  const v0=Math.sqrt(Math.max(1,R*gv/Math.max(0.12,Math.sin(2*th))));
  G.prev={...G.ball}; G.lastSafe={x:G.ball.x,y:G.ball.y};
  G.camX=G.ball.x-14; // la cámara se queda en el tee (como el original)
  G.flight={x:G.ball.x,y:G.ball.y,h:0,
    vx:v0*Math.cos(th)*Math.cos(ps.aim),vy:v0*Math.cos(th)*Math.sin(ps.aim),
    vh:v0*Math.sin(th),t:0,curve:(ps.curve*9*(0.4+ps.power))+(perfect?0:errDir*errLat*0.12),
    wx:Math.cos(G.wind.ang)*G.wind.mph*1.1,wy:Math.sin(G.wind.ang)*G.wind.mph*1.1,
    trail:[],R,perfect};
  G.stroke++;
  if(perfect){G.banner={txt:'★ NICE SHOT! ★',t:1.4};snd('nice');}
  else {setMsg(club.name+' · '+R.toFixed(0)+'y');snd('hit');}
  updateHUD();
}
function doPutt(power){
  const need=puttNeed();
  const errLat=(power-need)*40 + (Math.random()-0.5)*(6-golfer().put)*1.1;
  const a=G.aim+errLat*0.004, v=6+power*46;
  G.prev={x:G.ball.x,y:G.ball.y};
  G.putt={x:G.ball.x,y:G.ball.y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,t:0};
  G.stroke++;
  setMsg(power<=need*1.15&&power>=need*0.85?'Buen toque…':'¡Atento a la caída!');
  snd('putt'); updateHUD();
}
function puttNeed(){
  const d=distToPin(G.ball.x,G.ball.y);
  const s=slopeAt(G.ball.x,G.ball.y);
  const along=Math.cos(G.aim)*s.x+Math.sin(G.aim)*s.y;
  return Math.max(0.05,Math.min(1,(d/CLUBS[7].max)-along*0.12));
}

// ---------- 5. FÍSICA ----------
function stepFlight(dt){
  const f=G.flight; f.t+=dt;
  const n=3;
  for(let i=0;i<n;i++){
    const h=dt/n;
    f.vy+=f.curve*h*0.55;
    f.x+=(f.vx+f.wx)*h*0.14; f.y+=(f.vy+f.wy)*h*0.14;
    f.vh-=30*h; f.h+=f.vh*h;
    if(f.h<=0){f.h=0;land();return;}
  }
  f.trail.push({x:f.x,y:f.y});
  if(f.trail.length>70)f.trail.shift();
  G.ball.x=f.x;G.ball.y=f.y;G.ball.h=f.h;
}
function land(){
  const f=G.flight; G.flight=null;
  const x=f.x, y=f.y, lie=lieAt(x,y);
  if(lie==='water'){G.stroke++;G.ball={x:G.lastSafe.x,y:G.lastSafe.y,h:0};G.fade=1;setMsg('¡Al agua! Penalidad +1, drop');updateHUD();autoAimClub();return;}
  if(x<-60||x>hole().pin.x+160||Math.abs(y)>240){G.stroke++;G.ball={x:G.lastSafe.x,y:G.lastSafe.y,h:0};G.fade=1;setMsg('¡Fuera de límites! +1');updateHUD();autoAimClub();return;}
  const keep=lie==='fairway'?0.35:lie==='green'?0.5:lie==='tee'?0.3:lie==='rough'?0.08:0.0;
  const sp=Math.hypot(f.vx,f.vy)*0.14*keep, a=Math.atan2(f.vy,f.vx);
  G.roll={x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp};
  G.ball.h=0;
}
function stepRoll(dt){
  const r=G.roll, lie=lieAt(r.x,r.y);
  const fr=lie==='green'?7:lie==='fairway'?16:lie==='rough'?34:60;
  const s=slopeAt(r.x,r.y);
  r.vx+=s.x*18*dt; r.vy+=s.y*18*dt;
  const sp=Math.hypot(r.vx,r.vy), dec=fr*dt;
  if(sp<=Math.max(0.6,dec)){G.roll=null;G.ball.x=r.x;G.ball.y=r.y;settle(true);return;}
  r.vx-=r.vx/sp*dec; r.vy-=r.vy/sp*dec;
  r.x+=r.vx*dt; r.y+=r.vy*dt;
  if(lieAt(r.x,r.y)==='water'){G.stroke++;G.roll=null;G.ball={x:G.lastSafe.x,y:G.lastSafe.y,h:0};G.fade=1;setMsg('¡Rueda al agua! +1');updateHUD();}
  G.ball.x=r.x;G.ball.y=r.y;
}
function stepPutt(dt){
  const p=G.putt, s=slopeAt(p.x,p.y);
  p.vx+=s.x*10*dt; p.vy+=s.y*10*dt;
  const fr=8.5*dt, sp=Math.hypot(p.vx,p.vy);
  if(sp<=Math.max(0.4,fr)){G.putt=null;G.ball.x=p.x;G.ball.y=p.y;settle(false);return;}
  p.vx-=p.vx/sp*fr; p.vy-=p.vy/sp*fr;
  p.x+=p.vx*dt; p.y+=p.vy*dt;
  G.ball.x=p.x;G.ball.y=p.y;
}
function settle(cutCam){
  const d=distToPin(G.ball.x,G.ball.y);
  if(d<1.4){
    G.total+=G.stroke; G.holed=true;
    G.banner={txt:G.stroke-hole().par<=-2?'★ EAGLE! ★':G.stroke-hole().par===-1?'★ BIRDIE! ★':G.stroke-hole().par===0?'PAR':'BOGEY +'+(G.stroke-hole().par),t:2.2};
    setMsg('¡Embocada en '+G.stroke+'! ESPACIO para seguir'); updateHUD(); snd('hole'); return;
  }
  if(cutCam){G.camX=G.ball.x-14;G.fade=1;} // corte de cámara al landing
  autoAimClub();
}
function autoAimClub(){
  const h=hole();
  G.aim=Math.atan2(h.pin.y-G.ball.y,h.pin.x-G.ball.x);
  G.clubIndex=autoClub(); G.curve=0; updateHUD();
}
function nextHole(){
  G.holeIndex=(G.holeIndex+1)%HOLES.length; G.stroke=0; G.holed=false;
  const h=hole(); G.ball={x:h.tee.x,y:h.tee.y,h:0}; G.prev={...G.ball}; G.lastSafe={...G.ball};
  G.wind={ang:Math.random()*Math.PI*2,mph:2+Math.random()*11};
  G.camX=G.ball.x-14; G.fade=1;
  G.screen='intro';
}

// ---------- 6. PROYECCIÓN PSEUDO-3D ----------
function proj(wx,wy,h){
  h=h||0;
  const d=wx-G.camX;
  if(d<-4) return null;
  const K=G.K, f=K/(d+K), q=d/(d+K);
  const sx=W/2+(wy-G.camY())*f*16;
  const gy=(H+30)-(H+30-HOR)*q;
  return {x:sx, y:gy-h*f*3.4, f:f, q:q};
}

// ---------- 7. RENDER ----------
function draw(){
  if(G.screen==='select'){drawSelect();return;}
  if(G.screen==='intro'){drawIntro();return;}
  drawSky();
  drawCourse();
  drawGolferAndBall();
  drawAimMarker();
  drawMinimap();
  drawGauge();
  drawBanner();
  if(G.fade>0){ctx.fillStyle='rgba(0,0,0,'+Math.min(1,G.fade*1.4)+')';ctx.fillRect(0,0,W,H);G.fade-=0.06;}
}
function drawSky(){
  const g=ctx.createLinearGradient(0,0,0,HOR+40);
  g.addColorStop(0,'#2f7fe0');g.addColorStop(1,'#bfe6ff');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,HOR+40);
  // nubes pixel moviéndose
  ctx.fillStyle='#ffffffee';
  const t=G.cloudT;
  const clouds=[[120,60,3],[420,40,2],[700,80,4],[860,45,2],[250,95,2],[560,100,3]];
  for(const c of clouds){
    const cx=((c[0]+t*8)%(W+160))-80, cy=c[1], s=c[2]*3;
    ctx.fillRect(cx,cy,s*8,s*2);ctx.fillRect(cx+s*2,cy-s,s*5,s);ctx.fillRect(cx+s*6,cy,s*4,s*2);
  }
  // montañas
  ctx.fillStyle='#3b6ea5';
  ctx.beginPath();ctx.moveTo(0,HOR);ctx.lineTo(140,HOR-46);ctx.lineTo(300,HOR);ctx.fill();
  ctx.beginPath();ctx.moveTo(560,HOR);ctx.lineTo(700,HOR-60);ctx.lineTo(860,HOR);ctx.fill();
  ctx.fillStyle='#5b8fc4';
  ctx.beginPath();ctx.moveTo(140,HOR-46);ctx.lineTo(170,HOR-20);ctx.lineTo(110,HOR-20);ctx.fill();
}
function groundBase(){
  const g=ctx.createLinearGradient(0,HOR,0,H);
  g.addColorStop(0,'#3fa34d');g.addColorStop(1,'#256b32');
  ctx.fillStyle=g;ctx.fillRect(0,HOR,W,H-HOR);
  // franjas de corte
  ctx.fillStyle='#ffffff10';
  for(let i=0;i<6;i++){ctx.fillRect(0,HOR+8+i*66,W,26);}
}
function drawCourse(){
  groundBase();
  const h=hole();
  // fairway: polígono en perspectiva siguiendo la línea tee→pin
  ctx.fillStyle='#5cc46a';
  ctx.beginPath();
  let first=true;
  const steps=24, x0=Math.max(G.camX+2,h.tee.x-20), x1=h.pin.x+40;
  const L=[],Rr=[];
  for(let i=0;i<=steps;i++){
    const wx=x0+(x1-x0)*i/steps, c=fairwayCenterAt(wx);
    L.push(proj(wx,c.y-h.fairwayW/2,0));Rr.push(proj(wx,c.y+h.fairwayW/2,0));
  }
  for(const p of L){if(!p)continue;if(first){ctx.moveTo(p.x,p.y);first=false;}else ctx.lineTo(p.x,p.y);}
  for(let i=Rr.length-1;i>=0;i--){const p=Rr[i];if(!p)continue;ctx.lineTo(p.x,p.y);}
  ctx.closePath();ctx.fill();
  // agua
  for(const wt of h.water){
    const p=proj(wt.x,wt.y,0);if(!p)continue;
    ctx.fillStyle='#2f9fd8';
    ctx.beginPath();ctx.ellipse(p.x,p.y,wt.rx*p.f*16,Math.max(2,wt.ry*p.f*16*0.45+p.q*10),0,0,7);ctx.fill();
    ctx.fillStyle='#ffffff66';
    ctx.beginPath();ctx.ellipse(p.x-wt.rx*p.f*4,p.y-3,wt.rx*p.f*8,3,0,0,7);ctx.fill();
  }
  // green
  {const p=proj(h.pin.x,h.pin.y,0);
   if(p){const rx=h.green.rx*p.f*16, ry=Math.max(3,h.green.ry*p.f*16*0.5+p.q*12);
    const gg=ctx.createRadialGradient(p.x,p.y,2,p.x,p.y,Math.max(4,rx));
    gg.addColorStop(0,'#75e384');gg.addColorStop(1,'#3aa34c');
    ctx.fillStyle=gg;ctx.beginPath();ctx.ellipse(p.x,p.y,rx,ry,0,0,7);ctx.fill();
    // flechas de slope sobre el green
    const t=performance.now()/450, s0=slopeAt(h.pin.x,h.pin.y), mg=Math.hypot(s0.x,s0.y);
    if(mg>0.06){
      const an=Math.atan2(s0.y,s0.x);
      ctx.fillStyle=mg>0.6?'#ff5252':'#ffffff';
      ctx.font='bold 13px monospace';ctx.textAlign='center';
      for(let k=0;k<3;k++){
        const off=((t*10+k*14)%42)-21;
        const ax=p.x+Math.cos(an)*off, ay=p.y-4+Math.sin(an)*off*0.5;
        ctx.save();ctx.translate(ax,ay);ctx.rotate(an);ctx.fillText('➤',0,4);ctx.restore();
      }
      ctx.textAlign='left';
    }}}
  // bunkers
  for(const b of h.bunkers){
    const p=proj(b.x,b.y,0);if(!p)continue;
    ctx.fillStyle='#ecd88f';
    ctx.beginPath();ctx.ellipse(p.x,p.y,b.rx*p.f*16,Math.max(2,b.ry*p.f*16*0.5+p.q*8),0,0,7);ctx.fill();
  }
  // árboles (billboards, lejos→cerca)
  const trs=h.trees.map(t=>({t:t,d:t.x-G.camX})).filter(o=>o.d>-4).sort((a,b)=>b.d-a.d);
  for(const o of trs){
    const p=proj(o.t.x,o.t.y,0);if(!p)continue;
    const r=Math.max(3,15*p.f+4);
    ctx.fillStyle='#5b3a1e';ctx.fillRect(p.x-r*0.12,p.y-r*0.9,r*0.24,r*0.9);
    ctx.fillStyle='#14521f';ctx.beginPath();ctx.arc(p.x,p.y-r*1.2,r,0,7);ctx.fill();
    ctx.fillStyle='#2f9e44';ctx.beginPath();ctx.arc(p.x-r*0.3,p.y-r*1.45,r*0.62,0,7);ctx.fill();
  }
  // bandera + distancia al pin
  {const p=proj(h.pin.x,h.pin.y,0);
   if(p){ctx.strokeStyle='#c62828';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x,p.y-40);ctx.stroke();ctx.lineWidth=1;
    ctx.fillStyle='#ffd23f';ctx.beginPath();ctx.moveTo(p.x,p.y-40);ctx.lineTo(p.x+22,p.y-33);ctx.lineTo(p.x,p.y-26);ctx.fill();
    const d=distToPin(G.ball.x,G.ball.y);
    ctx.fillStyle='#000a';const label='PIN '+d.toFixed(0)+'y';
    ctx.font='bold 13px monospace';const tw=ctx.measureText(label).width;
    ctx.fillRect(p.x-tw/2-5,p.y-60,tw+10,18);
    ctx.fillStyle='#ffeb3b';ctx.fillText(label,p.x-tw/2,p.y-46);}}
}
// --- golfista pixel-art lateral (mirando a la derecha) con swing ---
function drawGolferAndBall(){
  if(G.flight||G.roll||G.putt){
    // durante el vuelo el golfista ya terminó el follow; dibujar bola+sombra
    drawBallInFlight();
    drawGolferSprite(true);
    return;
  }
  drawGolferSprite(false);
  // bola en el tee/posición (si no hubo MISS reciente la bola sigue ahí)
  const bp=proj(G.ball.x,G.ball.y,0);
  if(bp){ctx.fillStyle='#00000055';ctx.beginPath();ctx.ellipse(bp.x,bp.y+2,5,2,0,0,7);ctx.fill();
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(bp.x,bp.y,4.5,0,7);ctx.fill();}
}
function golferFeet(){
  const bp=proj(G.ball.x,G.ball.y,0);
  if(!bp) return {x:W/2-40,y:H-120};
  return {x:bp.x-16, y:bp.y+2};
}
function drawGolferSprite(small){
  const g=golfer(), pose=swingPose(), F=golferFeet();
  const s=small?1.6:2.6;
  const px=v=>Math.round(v);
  ctx.save();ctx.translate(px(F.x),px(F.y));
  const lean=pose.lean, crouch=pose.crouch;
  // sombra
  ctx.fillStyle='#00000044';ctx.beginPath();ctx.ellipse(6*s,2,12*s,3.4*s,0,0,7);ctx.fill();
  const legH=13*s*(1-0.25*crouch), hipY=-legH, shY=hipY-13*s, headY=shY-8*s;
  const leanX=lean*14*s;
  // piernas
  ctx.fillStyle=g.pants;
  ctx.fillRect(px(-5*s),px(hipY),px(4*s),px(legH));            // atrás
  ctx.fillRect(px(3*s+leanX*0.3),px(hipY),px(4*s),px(legH));   // adelante
  // zapatos
  ctx.fillStyle='#222';
  ctx.fillRect(px(-7*s),px(-2*s),px(7*s),px(2.6*s));
  ctx.fillRect(px(2*s+leanX*0.3),px(-2*s),px(7*s),px(2.6*s));
  // torso (camisa con sombreado)
  ctx.fillStyle=g.shirt;
  ctx.fillRect(px(-4*s+leanX*0.5),px(shY),px(9*s),px(13*s));
  ctx.fillStyle='#00000033';
  ctx.fillRect(px(-4*s+leanX*0.5),px(shY),px(3*s),px(13*s));
  // cabeza + gorra
  ctx.fillStyle=g.skin;ctx.fillRect(px(-1*s+leanX),px(headY),px(8*s),px(7*s));
  ctx.fillStyle=g.cap;ctx.fillRect(px(-2*s+leanX),px(headY-2.4*s),px(10*s),px(3*s));
  ctx.fillRect(px(5*s+leanX),px(headY-1*s),px(5*s),px(1.6*s)); // visera
  // brazos + palo (rotan con clubA alrededor de las manos/hombro)
  const a=pose.clubA*Math.PI/180;
  const hx=4*s+leanX, hy=shY+4*s; // manos
  const Lp=(G.swing.stage==='pdown'||lieAt(G.ball.x,G.ball.y)==='green')?15*s:24*s;
  const tipX=hx+Math.sin(a)*Lp, tipY=hy+Math.cos(a)*Lp;
  ctx.strokeStyle=g.skin;ctx.lineWidth=3*s;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(2*s+leanX*0.7,shY+2*s);ctx.lineTo(hx,hy);ctx.stroke();
  ctx.strokeStyle='#8d6e63';ctx.lineWidth=1.8*s;
  ctx.beginPath();ctx.moveTo(hx,hy);ctx.lineTo(tipX,tipY);ctx.stroke();
  ctx.fillStyle='#cfd8dc';ctx.fillRect(px(tipX-2*s),px(tipY-1*s),px(4.5*s),px(2.4*s)); // cabeza del palo
  // flash de impacto
  if(G.swing.stage==='follow'&&G.swing.t<0.12){
    ctx.fillStyle='#fff8';ctx.beginPath();ctx.arc(tipX,tipY,10*s*(1+G.swing.t*8),0,7);ctx.fill();
  }
  ctx.restore();
}
function drawBallInFlight(){
  const f=G.flight;
  const drawOne=(wx,wy,h,alpha,r)=>{
    const p=proj(wx,wy,h);if(!p)return;
    ctx.globalAlpha=alpha;
    const sh=proj(wx,wy,0);
    if(sh){ctx.fillStyle='#0006';ctx.beginPath();ctx.ellipse(sh.x,sh.y,Math.max(1.5,r*p.f*0.8),Math.max(1,r*p.f*0.4),0,0,7);ctx.fill();}
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(p.x,p.y,Math.max(1.5,r),0,7);ctx.fill();
    ctx.globalAlpha=1;
  };
  if(f){
    for(let i=0;i<f.trail.length;i+=2){const tp=f.trail[i];drawOne(tp.x,tp.y,tp.h||0,0.35,2);}
    const bp=proj(f.x,f.y,f.h);
    if(bp){
      const sh=proj(f.x,f.y,0);
      if(sh){ctx.fillStyle='#00000055';ctx.beginPath();ctx.ellipse(sh.x,sh.y,5,2.2,0,0,7);ctx.fill();}
      ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(bp.x,bp.y,5,0,7);ctx.fill();
      ctx.fillStyle='#c00';ctx.beginPath();ctx.arc(bp.x-1.5,bp.y-1.5,1.4,0,7);ctx.fill();
    }
  } else {
    const r=G.roll||G.putt;
    if(r){const p=proj(r.x,r.y,0);
      if(p){ctx.fillStyle='#0006';ctx.beginPath();ctx.ellipse(p.x,p.y+2,5,2,0,0,7);ctx.fill();
        ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(p.x,p.y,4.5,0,7);ctx.fill();}}
  }
}
function drawAimMarker(){
  if(G.screen!=='play'||G.meter||G.flight||G.roll||G.putt||G.holed) return;
  const club=CLUBS[G.clubIndex];
  const maxR=club.max*driveScale();
  const rr=club.id==='PT'?Math.min(28,distToPin(G.ball.x,G.ball.y)):Math.min(maxR,distToPin(G.ball.x,G.ball.y));
  const ex=G.ball.x+Math.cos(G.aim)*rr, ey=G.ball.y+Math.sin(G.aim)*rr;
  const s0=proj(G.ball.x,G.ball.y,0), s1=proj(ex,ey,0);
  if(!s0||!s1)return;
  ctx.strokeStyle=G.curve?'#40c4ff':'#ffffffdd';ctx.setLineDash([8,6]);ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(s0.x,s0.y-4);
  // curva prevista si hay hook/slice
  const midx=(s0.x+s1.x)/2+(G.curve*40), midy=(s0.y+s1.y)/2-10;
  ctx.quadraticCurveTo(midx,midy,s1.x,s1.y);ctx.stroke();ctx.setLineDash([]);ctx.lineWidth=1;
  const pulse=3+Math.sin(performance.now()/200)*1.2;
  ctx.strokeStyle='#ffeb3b';ctx.lineWidth=2;
  ctx.beginPath();ctx.arc(s1.x,s1.y,pulse+3,0,7);ctx.stroke();ctx.lineWidth=1;
  ctx.fillStyle='#000a';ctx.font='bold 12px monospace';
  const label=club.id==='PT'?'dirección':('carry ~'+rr.toFixed(0)+'y');
  const tw=ctx.measureText(label).width;
  ctx.fillRect(s1.x-tw/2-4,s1.y-30,tw+8,17);
  ctx.fillStyle='#ffeb3b';ctx.fillText(label,s1.x-tw/2,s1.y-17);
  if(G.curve){ctx.fillStyle='#40c4ff';ctx.font='bold 13px monospace';ctx.fillText(G.curve<0?'◀ HOOK':'SLICE ▶',s0.x+24,s0.y-24);}
}

// --- gauge vertical arcade (POWER + HEIGHT en el mismo mástil) ---
function drawGauge(){
  if(G.screen!=='play')return;
  const gx=W-64,gw=34,gy=150,gh=H-150-120;
  ctx.fillStyle='#000c';ctx.fillRect(gx-30,gy-34,gw+38,gh+84);
  ctx.fillStyle='#ffd23f';ctx.font='bold 12px monospace';ctx.textAlign='center';
  ctx.fillText('POWER',gx+gw/2,gy-18);
  ctx.fillText(CLUBS[G.clubIndex].name,gx+gw/2,gy-4);
  ctx.textAlign='left';
  ctx.fillStyle='#1a1a1a';ctx.fillRect(gx,gy,gw,gh);
  const cap=powerCap(),segs=36;
  for(let i=0;i<segs;i++){
    const f0=i/segs,f1=(i+1)/segs,fm=(f0+f1)/2;
    ctx.fillStyle=fm>1?'#b388ff':fm>0.85?'#ff5252':fm>0.6?'#ffb300':'#00e676';
    const y1=gy+gh-(f1/cap)*gh, y0=gy+gh-(f0/cap)*gh;
    const on=G.meter&&G.meter.phase==='power'?fm<=G.meter.p:(G.meter?fm<=G.meter.power:fm<0.001);
    if(on)ctx.fillRect(gx+3,y1+1,gw-6,Math.max(1,y0-y1-1));
  }
  ctx.strokeStyle='#fff';ctx.strokeRect(gx,gy,gw,gh);
  // línea 100%
  const y100=gy+gh-(1/cap)*gh;
  ctx.strokeStyle='#fff';ctx.beginPath();ctx.moveTo(gx-4,y100);ctx.lineTo(gx+gw+4,y100);ctx.stroke();
  // guideline de putt
  if(lieAt(G.ball.x,G.ball.y)==='green'){
    const n=puttNeed(),gyp=gy+gh-(n/cap)*gh;
    ctx.fillStyle='#40c4ff';ctx.fillRect(gx-6,gyp-2,gw+12,4);
  }
  // cursor HEIGHT: barre el mástil; rojo=MISS, blanco=perfect
  if(G.meter&&G.meter.phase==='height'){
    const lie=G.meter.lie,rz=redZone(lie),sw=heightSweet();
    ctx.fillStyle='#c62828';
    ctx.fillRect(gx,gy,gw,rz*gh);
    ctx.fillRect(gx,gy+gh*(1-rz),gw,rz*gh);
    ctx.fillStyle='#fff';
    const yc=gy+gh/2, hh=sw*gh;
    ctx.fillRect(gx,yc-hh,gw,hh*2);
    const yp=gy+gh-G.meter.p*gh;
    ctx.fillStyle='#00e5ff';ctx.fillRect(gx-5,yp-2,gw+10,5);
    ctx.fillStyle='#fff';ctx.font='10px monospace';
    ctx.fillText(lie.toUpperCase(),gx-24,gy+gh+14);
  }
  if(G.meter&&G.meter.phase==='power'){
    ctx.fillStyle='#fff';ctx.font='bold 11px monospace';
    ctx.fillText((G.meter.p*100).toFixed(0)+'%',gx-8,gy+gh+14);
  }
  // hint contextual
  ctx.fillStyle='#fff';ctx.font='12px monospace';
  let hint='';
  if(G.holed)hint='ESPACIO: siguiente hoyo';
  else if(G.flight)hint='···';
  else if(!G.meter)hint='ESPACIO: swing · Z:hook X:slice C:recto';
  else if(G.meter.phase==='power')hint='¡FIJA LA POTENCIA!';
  else hint='¡CLAVA EL BLANCO!';
  ctx.fillStyle='#000a';ctx.fillRect(12,H-30,ctx.measureText(hint).width+16,22);
  ctx.fillStyle='#ffeb3b';ctx.fillText(hint,20,H-14);
}

  ctx.fillStyle='#ecd88f';for(const b of h.bunkers){ctx.beginPath();ctx.ellipse(X(b.x),Y(b.y),b.rx/(x1-x0)*mw,b.ry/(y1-y0)*mh,0,0,7);ctx.fill();}
  ctx.fillStyle='#14521f';for(const t of h.trees){ctx.beginPath();ctx.arc(X(t.x),Y(t.y),5,0,7);ctx.fill();}
  ctx.fillStyle='#75e384';ctx.beginPath();ctx.ellipse(X(h.pin.x),Y(h.pin.y),h.green.rx/(x1-x0)*mw,h.green.ry/(y1-y0)*mh,0,0,7);ctx.fill();
  ctx.fillStyle='#fff';ctx.fillRect(X(h.tee.x)-3,Y(h.tee.y)-3,6,6);
  ctx.fillStyle='#f00';ctx.beginPath();ctx.arc(X(h.pin.x),Y(h.pin.y),5,0,7);ctx.fill();
  ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 15px monospace';
  ctx.fillText('ESPACIO: TEE OFF',W/2,H-40);
  ctx.textAlign='left';
}

// ---------- 8. INPUT ----------
function beginPlay(){
  G.screen='intro';
  const h=hole();
  G.ball={x:h.tee.x,y:h.tee.y,h:0};G.prev={...G.ball};G.lastSafe={...G.ball};
  G.camX=G.ball.x-14;
  autoAimClub();
}
document.addEventListener('keydown',e=>{
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();
  if(e.repeat&&e.code!=='ArrowLeft'&&e.code!=='ArrowRight')return;
  const k=e.code;
  if(G.screen==='select'){
    if(k.indexOf('Digit')===0){const n=+k.slice(5);if(n>=1&&n<=6){G.gi=n-1;beginPlay();}}
    else if(k==='Space'||k==='Enter')beginPlay();
    return;
  }
  if(G.screen==='intro'){
    if(k==='Space'||k==='Enter')G.screen='play';
    if(k.indexOf('Digit')===0){const n=+k.slice(5);if(n>=1&&n<=6)G.gi=n-1;}
    return;
  }
  if(k==='ArrowLeft')G.aim-=0.028;
  else if(k==='ArrowRight')G.aim+=0.028;
  else if(k==='ArrowUp'){G.clubIndex=Math.max(0,G.clubIndex-1);updateHUD();}
  else if(k==='ArrowDown'){G.clubIndex=Math.min(6,G.clubIndex+1);updateHUD();}
  else if(k==='KeyZ'){G.curve=-1;setMsg('HOOK armado (B)');}
  else if(k==='KeyX'){G.curve=1;setMsg('SLICE armado (C)');}
  else if(k==='KeyC'){G.curve=0;setMsg('Tiro recto');}
  else if(k==='KeyR')autoAimClub();
  else if(k==='Space'){
    if(G.holed){nextHole();return;}
    tapMeter();
  }
});
cv.addEventListener('click',()=>{
  if(G.screen==='select')beginPlay();
  else if(G.screen==='intro')G.screen='play';
  else if(G.holed)nextHole();
  else tapMeter();
});
cv.addEventListener('mousemove',e=>{
  if(G.screen!=='play'||G.meter||G.flight)return;
  G.aim+=e.movementX*0.0035;
});
function setMsg(m){document.getElementById('hudMsg').textContent=m;}
function updateHUD(){
  const h=hole(),g=golfer(),club=CLUBS[G.clubIndex];
  const names=['1st','2nd','3rd'];
  document.getElementById('hudHole').textContent=(names[G.holeIndex]||(G.holeIndex+1)+'th')+' HOLE · PAR '+h.par;
  document.getElementById('hudGolfer').textContent=g.name;
  document.getElementById('hudWind').textContent=G.wind.mph.toFixed(0)+' mph';
  document.getElementById('windArrow').style.transform='rotate('+G.wind.ang+'rad)';
  document.getElementById('hudStroke').textContent=G.stroke;
  const d=distToPin(G.ball.x,G.ball.y);
  document.getElementById('hudClub').textContent=club.name+' · '+(club.max*driveScale()).toFixed(0)+'y · '+d.toFixed(0)+'y · '+lieAt(G.ball.x,G.ball.y);
}
let AC=null;
function tone(f,dur,delay){
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const t=AC.currentTime+(delay||0);
    const o=AC.createOscillator(),gn=AC.createGain();
    o.connect(gn);gn.connect(AC.destination);
    o.type='square';o.frequency.value=f;gn.gain.value=0.05;
    o.start(t);o.stop(t+dur);
  }catch(e){}
}
function snd(kind){
  if(kind==='hit'){tone(220,0.08);tone(440,0.1,0.05);}
  else if(kind==='nice'){tone(660,0.1);tone(880,0.1,0.1);tone(1320,0.2,0.2);}
  else if(kind==='miss'){tone(140,0.25);}
  else if(kind==='putt'){tone(330,0.07);}
  else if(kind==='hole'){tone(523,0.12);tone(659,0.12,0.12);tone(784,0.12,0.24);tone(1046,0.3,0.36);}
}

// ---------- 9. GAME LOOP ----------
let last=performance.now();
function loop(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;
  G.cloudT+=dt;
  if(G.banner){G.banner.t-=dt;if(G.banner.t<=0)G.banner=null;}
  if(G.screen==='play'){
    const sw=G.swing;
    if(sw.stage==='back'&&!G.meter)sw.stage='idle';
    if(sw.stage==='top'&&(!G.meter||G.meter.phase!=='height'))sw.stage='idle';
    if(sw.stage==='down'||sw.stage==='pdown'){sw.t+=dt;if(sw.t>=0.15){impact();}}
    else if(sw.stage==='follow'){sw.t+=dt;if(sw.t>0.55&&!G.flight)sw.stage='idle';}
    if(G.meter){
      const sp=meterSpeed(G.meter.lie)*(G.meter.phase==='power'?0.9:1.25);
      if(G.meter.phase==='power'){
        G.meter.p+=sp*dt*G.meter.dir;
        if(G.meter.p>=powerCap()){G.meter.p=powerCap();G.meter.dir=-1;}
        if(G.meter.p<=0){G.meter.p=0;G.meter.dir=1;}
      }else{
        G.meter.p+=sp*dt*1.4*G.meter.dir;
        if(G.meter.p>=1){G.meter.p=1;G.meter.dir=-1;}
        if(G.meter.p<=0){G.meter.p=0;G.meter.dir=1;}
      }
    }
    if(G.flight)stepFlight(dt);
    else if(G.roll)stepRoll(dt);
    else if(G.putt)stepPutt(dt);
    // la cámara persigue suave hasta detrás de la bola (salvo en vuelo)
    if(!G.flight){
      const onG=lieAt(G.ball.x,G.ball.y)==='green';
      const wantK=onG?30:55, wantX=G.ball.x-(onG?8:14);
      G.K+=(wantK-G.K)*0.06;G.camX+=(wantX-G.camX)*0.08;
    }
  }
  draw();
  requestAnimationFrame(loop);
}
G.camY=function(){return G.ball.y*0.15;};
updateHUD();
requestAnimationFrame(loop);
</script>
